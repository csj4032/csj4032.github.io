<script type="text/javascript" id="category-tree-state">
  (function() {
    // 카테고리 목록에서 접어 둔 1뎁스를 기억한다.
    // 닫힌 것만 저장하므로, 나중에 추가되는 카테고리는 기본 펼침 상태로 나온다.
    var KEY = 'category-tree-closed';
    var groups = document.querySelectorAll('.category-all-page .category-group[data-slug]');
    if (!groups.length) return;

    function read() {
      try {
        var raw = localStorage.getItem(KEY);
        var list = raw ? JSON.parse(raw) : [];
        return Object.prototype.toString.call(list) === '[object Array]' ? list : [];
      } catch (e) {
        return [];   // 시크릿 모드 등 저장소를 못 쓰는 경우
      }
    }

    function write(list) {
      try {
        localStorage.setItem(KEY, JSON.stringify(list));
      } catch (e) {}
    }

    var closed = read();

    Array.prototype.forEach.call(groups, function(group) {
      var slug = group.getAttribute('data-slug');

      if (closed.indexOf(slug) !== -1) {
        group.open = false;
      }

      group.addEventListener('toggle', function() {
        var list = read();
        var at = list.indexOf(slug);
        if (group.open) {
          if (at !== -1) list.splice(at, 1);
        } else if (at === -1) {
          list.push(slug);
        }
        write(list);
      });
    });
  })();
</script>
